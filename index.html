<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一键安装</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; background: #f2f4f7; }
        .card { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 400px; margin: 0 auto; }
        .btn { display: block; width: 100%; padding: 18px 0; background: linear-gradient(135deg, #ff5722, #ff7043); color: white; text-decoration: none; border-radius: 12px; font-size: 18px; font-weight: bold; border: none; cursor: pointer; }
        .btn:active { opacity: 0.8; }
        
        /* 兜底二维码区域，默认隐藏 */
        #qr-fallback { display: none; margin-top: 30px; border-top: 1px dashed #ccc; padding-top: 20px; }
        #qr-fallback p { color: #666; font-size: 14px; margin-bottom: 15px; }
        #qrcode { width: 200px; height: 200px; margin: 0 auto; }
        
        #wx-tip { display: none; background: #ff9800; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="wx-tip">⚠️ 请点击右上角 ··· 选择“在浏览器打开”</div>

    <div class="card">
        <h2>Apple Music 极简版</h2>
        <button class="btn" id="installBtn">📲 点击安装到手表</button>
        
        <!-- 如果跳转失败，会显示这个二维码让用户扫 -->
        <div id="qr-fallback">
            <p>若上方按钮无法跳转，请用另一台设备<br>打开 <b>Zepp App -> 开发者模式 -> 扫一扫</b></p>
            <div id="qrcode"></div>
        </div>
    </div>

    <!-- 引入二维码生成库 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // 你的干净专属链接
        var zpkLink = "zpkd1://zip2.webgetstore.com/ad1d45969535d7485037395436c7aa82/6adcf6fe/2026/10/25/f7bb867a613a36f7b6e02f5464bdaf36.zip?fn=huami.zpk";

        // 微信环境检测
        if (navigator.userAgent.toLowerCase().indexOf('micromessenger') !== -1) {
            document.getElementById('wx-tip').style.display = 'block';
        }

        document.getElementById('installBtn').addEventListener('click', function() {
            var startTime = Date.now();
            
            // 姿势1：尝试直接跳转
            window.location.href = zpkLink;
            
            // 姿势2：用 iframe 强行唤起（针对部分安卓浏览器）
            var ifr = document.createElement('iframe');
            ifr.style.display = 'none';
            ifr.src = zpkLink;
            document.body.appendChild(ifr);
            
            // 姿势3：用 replace 替换历史记录（针对 iOS Safari）
            setTimeout(function() {
                window.location.replace(zpkLink);
            }, 50);

            // 兜底逻辑：如果 2.5 秒后页面还没被切走（说明跳转被拦截了）
            setTimeout(function() {
                if (Date.now() - startTime < 2600) {
                    // 显示备用二维码
                    document.getElementById('qr-fallback').style.display = 'block';
                    
                    // 如果还没生成过二维码，就生成一个
                    if (document.getElementById('qrcode').innerHTML === '') {
                        new QRCode(document.getElementById("qrcode"), {
                            text: zpkLink,
                            width: 200,
                            height: 200,
                            colorDark : "#000000",
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.H
                        });
                    }
                }
            }, 2500);
        });
    </script>
</body>
</html>
