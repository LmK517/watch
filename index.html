<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的表盘/应用分享</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f2f4f7; color: #333; padding: 20px; padding-bottom: 50px; }
        .header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        .header h1 { font-size: 24px; color: #111; letter-spacing: 1px; }
        .header p { font-size: 14px; color: #888; margin-top: 8px; }
        .card { background: #ffffff; border-radius: 16px; padding: 24px 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); display: flex; flex-direction: column; align-items: center; }
        .card h2 { font-size: 20px; margin-bottom: 8px; color: #222; }
        .card .desc { font-size: 14px; color: #777; margin-bottom: 20px; text-align: center; }
        .install-btn { display: block; width: 100%; padding: 16px 0; background: linear-gradient(135deg, #ff5722, #ff7043); color: white; text-align: center; text-decoration: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; transition: opacity 0.2s; box-shadow: 0 4px 10px rgba(255, 87, 34, 0.3); }
        .install-btn:active { opacity: 0.8; transform: scale(0.98); }
        #wx-tip { display: none; background: #ff9800; color: white; text-align: center; padding: 15px; border-radius: 10px; font-weight: bold; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="wx-tip">
        ⚠️ 你正在微信内打开，无法跳转安装。<br>
        请点击右上角 <b>···</b> 选择 <b>在浏览器打开</b>！
    </div>

    <div class="header">
        <h1>我的表盘/应用分享</h1>
        <p>支持华米 GTR 4 / GTS 4 等全系机型</p>
    </div>

    <div class="card">
        <h2>Apple Music 极简版</h2>
        <p class="desc">黑底白字，极致仿苹果体验</p>
        <!-- 下面这个 href 里已经填好了你的链接，不需要改动了 -->
        <a class="install-btn" href="zpkd1://zip2.webgetstore.com/fd3b127af2aea4091011617315c62cf2/6adce902/2026/10/25/29d6e91c81d861a504ad2dd3d9a7764b.zip?fn=01%20(1).zpk">
            📲 点击安装到手表
        </a>
    </div>

    <script>
        function isWeixin() { return navigator.userAgent.toLowerCase().indexOf('micromessenger') !== -1; }
        if (isWeixin()) { document.getElementById('wx-tip').style.display = 'block'; }

        document.querySelectorAll('.install-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                var link = this.getAttribute('href');
                if (isWeixin()) { e.preventDefault(); return; }
                try { window.location.href = link; } catch (err) { console.log("跳转失败", err); }
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
